manifestVersion: 1
id: mxrck-bookorbit
category: files
name: BookOrbit
version: "3.9.1"
tagline: Tu espacio de lectura self-hosted para libros, audiolibros y cómics
description: >-
  BookOrbit es una plataforma self-hosted de biblioteca y lectura para EPUB, PDF,
  audiolibros y cómics (CBZ/CBR/CB7). Sincroniza progreso y subrayados entre el lector
  web, Kobo y KOReader, con búsqueda de metadatos, estadísticas, OPDS y OIDC multiusuario.

  Esta versión incluye el layout de series para cómics y manga (una carpeta por serie,
  "Folders are series"), que agrupa los capítulos sueltos en una sola serie.
releaseNotes: >-
  Paquete 3.9.1 (imagen 3.9.0): arregla el host de Postgres. Umbrel comparte una sola red
  docker entre apps, así que POSTGRES_HOST=postgres resolvía al Postgres de otra app y la
  autenticación fallaba. Ahora apunta al contenedor propio y lleva container_name fijo.
  Las migraciones de base de datos corren solas al arrancar.
developer: bookorbit
website: https://bookorbit.app
dependencies: []
