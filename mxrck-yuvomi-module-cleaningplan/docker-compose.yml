version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mxrck-yuvomi-module-cleaningplan_router_1
      APP_PORT: 8080
      # The module page runs inside Yuvomi and calls /api/extensions/cleaningplan/* from
      # the browser with the Yuvomi session cookie. Household members are not necessarily
      # signed in to Umbrel, and a fetch inside a PWA cannot answer an Umbrel login, so the
      # API prefix skips the Umbrel login. That path is not open: the sidecar validates
      # every request against Yuvomi's GET /api/v1/auth/me with the caller's own cookie and
      # enforces a CSRF token plus an exact Origin check on every write. The status page
      # stays behind the Umbrel login.
      PROXY_AUTH_WHITELIST: "/api/*"

  # Front of this app only: serves the status page and forwards the module's API prefix to
  # the sidecar, so the single Umbrel port answers both. The reverse-proxy rule that
  # matters for the browser is the one on your Yuvomi domain (see the status page).
  router:
    image: nginx:1.27-alpine
    restart: on-failure
    depends_on:
      - api
    # Config written here on purpose: umbrel copies the app directory into APP_DATA_DIR at
    # install time and does NOT refresh those files on update, so a mounted .conf would
    # stay frozen at the version that installed the app. docker-compose.yml itself IS
    # regenerated on every update, so the config travels with the version.
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 8080;
          server_tokens off;
          location /api/extensions/cleaningplan/ {
            # Nombre único del contenedor, no el alias "api": todas las apps comparten
            # umbrel_main_network, así que "api" resuelve a varios contenedores y nginx
            # reparte las peticiones entre ellos (404 intermitentes en la mitad de ellas).
            proxy_pass http://mxrck-yuvomi-module-cleaningplan_api_1:3100;
            proxy_http_version 1.1;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }
          location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $$uri /index.html;
          }
        }
        EOF
        exec nginx -g 'daemon off;'
    volumes:
      - ${APP_DATA_DIR}/data/status:/usr/share/nginx/html:ro

  api:
    # 0.2.1, pinned by index digest. Source audited at the same revision the image declares
    # (org.opencontainers.image.revision 5ff4773).
    image: ghcr.io/la3mmchen/yuvomi-cleaningplan-api:0.2.1@sha256:845ca9dfc93b3a985f94ebf68ebfedded574f126248ce9fb6d5345aec2301cdf
    restart: on-failure
    stop_grace_period: 1m
    # Reaches Yuvomi through the port Umbrel publishes on this machine, so it works whatever
    # the sibling app's container is called. Its entrypoint starts as root only to chown
    # /data, then drops to the unprivileged node user.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3100
      DB_PATH: /data/cleaningplan.db
      YUVOMI_INTERNAL_URL: ${YUVOMI_INTERNAL_URL:-http://host.docker.internal:8180}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://umbrel.local:8180}
    volumes:
      - ${APP_DATA_DIR}/data/db:/data
