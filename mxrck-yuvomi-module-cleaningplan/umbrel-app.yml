manifestVersion: 1
id: mxrck-yuvomi-module-cleaningplan
storage:
  dataRoot: data
environment:
  - name: YUVOMI_INTERNAL_URL
    services:
      - api
    default: "http://host.docker.internal:8180"
    note: How this sidecar reaches Yuvomi from inside its container. The default hits the Yuvomi app published on this same Umbrel on port 8180. Change it only if your Yuvomi listens on another port or runs on another host.
  - name: PUBLIC_ORIGIN
    services:
      - api
    default: "http://umbrel.local:8180"
    note: The exact origin you type in the browser to open Yuvomi, with scheme and host and no trailing slash, for example https://familia.example.com. Every write is refused with 403 csrf_invalid unless the request Origin matches this value exactly, so a wrong entry shows up as failing saves inside the module.
category: files
name: Cleaning plan (Yuvomi module)
version: "0.2.1"
tagline: Rooms and recurring cleaning tasks, as a Yuvomi module backend
description: >-
  Backend service for the "Cleaning plan" module of Yuvomi. Define rooms, the activities in each
  room and how often they repeat, then generate an iteration: every due activity becomes a normal
  Yuvomi task with its date, time and assignee, so it shows on the dashboard and in Tasks and
  anyone can tick it off.


  This app is only the sidecar. Yuvomi modules are browser code and may not touch Yuvomi's
  database, so this service keeps the plan in its own SQLite file and answers under
  /api/extensions/cleaningplan/ on the Yuvomi origin. To use it you still need two things: the
  module page installed inside Yuvomi (Settings -> Modules -> Add custom module, then approve it),
  and one reverse-proxy rule sending /api/extensions/cleaningplan/* from your Yuvomi domain to this
  app. The status page of this app repeats those steps and shows whether the service answers.


  It never writes to your Yuvomi database: it reads and creates tasks through Yuvomi's own
  /api/v1 REST API, and re-checks the caller's session against Yuvomi on every request, honouring
  the ext:cleaningplan permission from Settings -> Household -> Roles and permissions.


  Data lives in this app's data folder (its own SQLite database) and is included in Umbrel
  backups. Upgrades need both halves on the same version: bump this app, then reinstall the module
  page from Yuvomi's Settings.


  Independent third-party module by la3mmchen, packaged for this store. Source and license (MIT):
  https://github.com/la3mmchen/yuvomi-cleaningplan
developer: Alex (la3mmchen)
website: https://github.com/la3mmchen/yuvomi-cleaningplan
dependencies:
  - yuvomi
repo: https://github.com/Mxrck/umbrel-store
support: https://github.com/la3mmchen/yuvomi-cleaningplan/issues
port: 8183
