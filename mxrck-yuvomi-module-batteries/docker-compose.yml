version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mxrck-yuvomi-module-batteries_router_1
      APP_PORT: 8080
      # La página del módulo corre dentro de Yuvomi y llama a /api/extensions/batteries/* desde el
      # navegador con la sesión de Yuvomi. Los miembros de la casa no tienen por qué tener sesión en
      # Umbrel, y un fetch dentro de una PWA no puede contestar el login, así que el prefijo de la
      # API se salta el login de Umbrel. Ese camino no queda abierto: el sidecar valida cada petición
      # contra GET /api/v1/auth/me de Yuvomi con la credencial del llamante y exige token CSRF y
      # Origin exacto en cada escritura. La página de estado sigue detrás del login de Umbrel.
      PROXY_AUTH_WHITELIST: "/api/*"

  # Frente de esta app: sirve la página de estado y manda el prefijo de la API al sidecar, para que
  # el puerto único de Umbrel conteste las dos cosas. La regla de proxy que de verdad importa para el
  # navegador es la del dominio de Yuvomi (ver la página de estado).
  router:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: on-failure
    depends_on:
      - api
    # Config escrita aquí a propósito: umbrel copia el directorio de la app a APP_DATA_DIR al
    # instalar y NO refresca esos archivos en las actualizaciones, así que un .conf montado se
    # quedaría congelado en la versión que instaló la app. docker-compose.yml sí se regenera en cada
    # actualización, así que la config viaja con la versión.
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 8080;
          server_tokens off;
          location /api/extensions/batteries/ {
            # Nombre único del contenedor, NO el alias corto "api": todos los servicios de
            # todas las apps comparten umbrel_main_network, así que "api" resuelve a varios
            # contenedores y nginx reparte las peticiones entre ellos (404 intermitentes).
            proxy_pass http://mxrck-yuvomi-module-batteries_api_1:3100;
            proxy_http_version 1.1;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }
          location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $$uri /index.html;
          }
        }
        EOF
        exec nginx -g 'daemon off;'
    volumes:
      - ${APP_DATA_DIR}/data/status:/usr/share/nginx/html:ro

  api:
    # 0.1.0, fijada por digest de índice (tag v0.1.0 = sha256:41a6db53…, solo amd64).
    # La imagen trae también la página del módulo y la publica en /modules-out, que es la carpeta de
    # módulos de Yuvomi montada desde /Home/yuvomi-modules (customMounts), para que las dos mitades
    # viajen en la misma versión y nadie tenga que aprobar el módulo a mano.
    image: ghcr.io/mxrck/yuvomi-batteries@sha256:41a6db53226065e59318185451fd80324d25eae9826cbbadaa2ff1dc1c6b93b5
    restart: on-failure
    stop_grace_period: 1m
    # Alcanza Yuvomi por el puerto que Umbrel publica en este equipo, así funciona sin importar cómo
    # se llame el contenedor de la app vecina. El entrypoint arranca como root solo para hacer chown
    # de /data y de la carpeta de módulos, y luego baja al usuario node.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3100
      DB_PATH: /data/batteries.db
      YUVOMI_INTERNAL_URL: ${YUVOMI_INTERNAL_URL:-http://host.docker.internal:8180}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://umbrel.local:8180}
      HOUSEHOLD_TZ: ${HOUSEHOLD_TZ:-America/Merida}
      TZ: ${HOUSEHOLD_TZ:-America/Merida}
    volumes:
      - ${APP_DATA_DIR}/data/db:/data
